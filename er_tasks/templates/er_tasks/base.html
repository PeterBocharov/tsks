<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>{% block title %}Eva HelpDesk{% endblock %}</title>
  <script src="https://cdn.jsdelivr.net/npm/chart.js@4.4.1/dist/chart.umd.min.js"></script>
  <style>
    :root { --bg:#0f1419; --card:#1a2330; --text:#e8eef5; --muted:#8aa0b8; --line:#2a3545; --accent:#3d8bfd; }
    * { box-sizing: border-box; }
    body { margin:0; font-family: "Segoe UI", system-ui, sans-serif; background:var(--bg); color:var(--text); }
    a { color:var(--accent); text-decoration:none; }
    header { display:flex; gap:1.5rem; align-items:center; padding:1rem 1.5rem; border-bottom:1px solid var(--line); }
    header nav { display:flex; gap:1rem; }
    header nav a { color:var(--muted); }
    header nav a.active, header nav a:hover { color:var(--text); }
    main { padding:1.5rem; }
    .filters { display:flex; flex-wrap:wrap; gap:.75rem; margin-bottom:1.5rem; }
    .filters label { font-size:.8rem; color:var(--muted); display:flex; flex-direction:column; gap:.25rem; }
    .filters input, .filters select, .filters button {
      background:var(--card); color:var(--text); border:1px solid var(--line); border-radius:6px; padding:.4rem .6rem;
    }
    .cards { display:grid; grid-template-columns:repeat(auto-fit,minmax(160px,1fr)); gap:1rem; margin-bottom:1.5rem; }
    .card { background:var(--card); border:1px solid var(--line); border-radius:10px; padding:1rem; }
    .card .n { font-size:1.8rem; font-weight:600; }
    .card .l { color:var(--muted); font-size:.85rem; }
    table { width:100%; border-collapse:collapse; background:var(--card); border-radius:10px; overflow:hidden; }
    th, td { text-align:left; padding:.55rem .75rem; border-bottom:1px solid var(--line); font-size:.9rem; }
    th { color:var(--muted); font-weight:500; }
    .chart { background:var(--card); border:1px solid var(--line); border-radius:10px; padding:1rem; margin-bottom:1.5rem; height:320px; }
    .grid2 { display:grid; grid-template-columns:1fr 1fr; gap:1rem; }
    @media (max-width:800px) { .grid2 { grid-template-columns:1fr; } }
  </style>
</head>
<body>
<header>
  <strong>Eva HelpDesk</strong>
  <nav>
    <a href="{% url 'er_tasks:volume' %}" {% if request.resolver_match.url_name == 'volume' %}class="active"{% endif %}>Volume</a>
    <a href="{% url 'er_tasks:aging' %}" {% if request.resolver_match.url_name == 'aging' %}class="active"{% endif %}>Aging</a>
    <a href="{% url 'er_tasks:queues' %}" {% if request.resolver_match.url_name == 'queues' %}class="active"{% endif %}>Queues</a>
    <a href="{% url 'er_tasks:custom' %}" {% if request.resolver_match.url_name == 'custom' %}class="active"{% endif %}>Custom</a>
  </nav>
</header>
<main>
  <form class="filters" method="get">
    <label>From <input type="date" name="from" value="{{ params.from }}"></label>
    <label>To <input type="date" name="to" value="{{ params.to }}"></label>
    <label>Request type
      <select name="request_type">
        <option value="">All</option>
        {% for rt in filters.request_types %}
          <option value="{{ rt }}" {% if params.request_type == rt %}selected{% endif %}>{{ rt }}</option>
        {% endfor %}
      </select>
    </label>
    <label>Assignee
      <select name="assignee">
        <option value="">All</option>
        {% for a in filters.assignees %}
          <option value="{{ a }}" {% if params.assignee == a %}selected{% endif %}>{{ a }}</option>
        {% endfor %}
      </select>
    </label>
    <button type="submit">Filter</button>
  </form>
  {% block content %}{% endblock %}
</main>
</body>
</html>
